<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BOUSOL · No connection</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12293f; color: #fff;
         font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .card { background: #f8f5ee; color: #12293f; border-radius: 16px; padding: 28px; max-width: 360px; }
  button { margin-top: 16px; background: #f0a332; color: #12293f; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <h1 style="font-size:22px;margin:0 0 8px">Connect once to start</h1>
    <p>BOUSOL needs an internet connection the first time it opens on this device. After that it works offline.</p>
    <button onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
  </div>
</body>
</html>
